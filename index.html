<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liber Syntauri — Tu Horóscopo del Día</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap');

  :root{
    --bg:#0b0907; --ink:#ece3cc; --ink-dim:#a99c80; --ink-faint:#73694f;
    --gold:#cBa653; --gold-bright:#e8c874; --gold-dim:#7a6330;
    --panel:#15110d; --panel2:#1d1812; --border:#34291b; --border-lit:#52401f;
    --Fuego:#d4622a; --Agua:#3a6f9a; --Aire:#7eb8c9; --Tierra:#8b6f3e;
    --r:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    min-height:100vh; color:var(--ink);
    font-family:'EB Garamond',Georgia,serif; font-size:18px; line-height:1.7;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, #221a10 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 90% 110%, #1a1208 0%, transparent 55%),
      var(--bg);
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  /* faint starfield */
  body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(1px 1px at 20% 30%, #fff3 0, transparent),
      radial-gradient(1px 1px at 70% 60%, #fff2 0, transparent),
      radial-gradient(1px 1px at 40% 80%, #fff3 0, transparent),
      radial-gradient(1px 1px at 85% 20%, #fff2 0, transparent),
      radial-gradient(1px 1px at 55% 45%, #fff2 0, transparent);
    background-size:cover;}
  .wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:56px 22px 90px}

  /* ── HEADER ── */
  .top{text-align:center;margin-bottom:44px}
  .top .mark{font-size:40px;color:var(--gold);text-shadow:0 0 30px rgba(203,166,83,.4);line-height:1;margin-bottom:14px;
    animation:glow 4s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.85}50%{opacity:1}}
  .top h1{font-family:'Cinzel',serif;font-size:23px;font-weight:600;letter-spacing:5px;color:var(--gold-bright);text-transform:uppercase}
  .top .rule{width:60px;height:1px;margin:16px auto;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent)}
  .top p{color:var(--ink-dim);font-style:italic;font-size:16px;letter-spacing:.3px}

  /* ── FORM CARD ── */
  .card{background:linear-gradient(165deg,var(--panel) 0%,#0d0a07 100%);border:1px solid var(--border);
    border-radius:var(--r);padding:30px 28px;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(232,200,116,.04)}
  .card .lead{font-family:'Cinzel',serif;font-size:12px;letter-spacing:2px;color:var(--gold-dim);text-transform:uppercase;text-align:center;margin-bottom:22px}
  .fld{margin-bottom:18px}
  .fld label{display:block;font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;color:var(--ink-dim);text-transform:uppercase;margin-bottom:8px}
  .fld input{width:100%;background:#0a0806;border:1px solid var(--border);color:var(--ink);
    padding:13px 16px;border-radius:8px;font-family:'EB Garamond',serif;font-size:18px;transition:border-color .2s,box-shadow .2s}
  .fld input::placeholder{color:var(--ink-faint)}
  .fld input:focus{outline:none;border-color:var(--gold-dim);box-shadow:0 0 0 3px rgba(203,166,83,.08)}
  .go{width:100%;margin-top:8px;padding:15px;border:none;border-radius:8px;cursor:pointer;
    background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#1a1208;
    font-family:'Cinzel',serif;font-size:13px;letter-spacing:2.5px;font-weight:600;text-transform:uppercase;
    transition:filter .15s,transform .15s;box-shadow:0 4px 20px rgba(203,166,83,.22)}
  .go:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .go:disabled{opacity:.55;cursor:wait;transform:none}
  .err{color:#e89b8a;font-size:14px;text-align:center;margin-top:14px;min-height:18px}

  /* ── RESULT ── */
  #result{margin-top:30px;display:none}
  #result.show{display:block;animation:rise .6s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

  .reading{background:linear-gradient(165deg,var(--panel) 0%,#0d0a07 100%);border:1px solid var(--border);
    border-radius:var(--r);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}

  /* hero */
  .hero{padding:32px 28px 26px;text-align:center;position:relative;border-bottom:1px solid var(--border)}
  .hero .crest{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:6px}
  .crest .sg{display:flex;flex-direction:column;align-items:center;gap:7px}
  .crest .orb{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:20px;box-shadow:0 0 22px var(--oc,#0000),inset 0 -4px 12px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.12)}
  .crest .sg .nm{font-family:'Cinzel',serif;font-size:13px;color:var(--gold-bright);letter-spacing:1px}
  .crest .sg .rl{font-size:11px;color:var(--ink-faint);letter-spacing:1.5px;text-transform:uppercase}
  .crest .sg .tapln{font-size:10px;color:var(--gold-dim);letter-spacing:.5px;margin-top:2px;opacity:.85}
  .crest .sg:hover .tapln,.crest .sg:focus .tapln{color:var(--gold-bright)}
  .crest .sg:hover .orb,.crest .sg:focus .orb{box-shadow:0 0 0 4px var(--oc),0 0 22px var(--oc)}
  .crest .cross{font-size:20px;color:var(--gold-dim)}
  .hero .greet{font-size:17px;color:var(--ink-dim);margin-top:14px;font-style:italic}
  .hero .today{font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;color:var(--ink-faint);text-transform:uppercase;margin-top:6px}

  .title{font-family:'Cinzel',serif;font-size:21px;color:var(--gold-bright);text-align:center;padding:26px 28px 4px;letter-spacing:.5px;line-height:1.4}

  .body{padding:18px 30px 8px}
  .body .texto{font-size:18.5px;line-height:1.85}
  .body .texto::first-letter{font-family:'Cinzel',serif;font-size:46px;float:left;line-height:.8;
    padding:6px 12px 4px 0;color:var(--gold)}

  .blocks{padding:6px 30px 4px;display:flex;flex-direction:column;gap:2px}
  .blk{padding:18px 0;border-top:1px solid var(--border)}
  .blk h4{font-family:'Cinzel',serif;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:9px}
  .blk h4 .i{font-size:14px}
  .blk.tension h4{color:#d99c6b} .blk.don h4{color:var(--gold-bright)} .blk.sombra h4{color:#b98ca8}
  .blk p{color:var(--ink);font-size:17px;line-height:1.75}

  /* elemental interaction strip */
  .elem-strip{margin:6px 30px 0;padding:16px 18px;background:var(--panel2);border:1px solid var(--border);border-radius:8px}
  .elem-strip .tag{font-family:'Cinzel',serif;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;
    color:#1a1208;padding:3px 9px;border-radius:10px;background:var(--gold-dim);margin-right:10px}
  .elem-strip b{font-family:'Cinzel',serif;color:var(--gold-bright);font-size:13px}
  .elem-strip p{color:var(--ink-dim);font-size:15px;margin-top:7px;line-height:1.65}

  /* closing phrase */
  .frase{margin:24px 30px 0;padding:24px 26px;text-align:center;border-top:1px solid var(--border);position:relative}
  .frase .q{font-size:34px;color:var(--gold-dim);line-height:0;position:relative;top:14px}
  .frase p{font-family:'EB Garamond',serif;font-style:italic;font-size:20px;color:var(--gold);line-height:1.6;letter-spacing:.3px}

  /* profile accordion */
  .profile{margin:18px 30px 30px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .spbtns{display:flex;gap:12px;flex-wrap:wrap;margin:18px 30px 30px}
  .spbtns button{flex:1;min-width:160px;background:rgba(203,166,83,.07);border:1px solid var(--gold-dim);color:var(--gold-bright);
    font-family:'Cinzel',serif;font-size:12px;letter-spacing:1px;padding:13px 16px;border-radius:8px;cursor:pointer;transition:background .18s}
  .spbtns button:hover{background:rgba(203,166,83,.16)}
  .profile summary{padding:14px 18px;cursor:pointer;list-style:none;font-family:'Cinzel',serif;font-size:12px;
    letter-spacing:2px;text-transform:uppercase;color:var(--gold-dim);display:flex;justify-content:space-between;align-items:center;background:var(--panel2)}
  .profile summary::-webkit-details-marker{display:none}
  .profile summary .chev{transition:transform .25s}
  .profile[open] summary .chev{transform:rotate(90deg)}
  .profile .pbody{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
  .prow{display:flex;gap:12px;font-size:15px;border-bottom:1px solid rgba(52,41,27,.5);padding-bottom:9px}
  .prow:last-child{border:none;padding:0}
  .prow .k{font-family:'Cinzel',serif;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-faint);width:108px;flex-shrink:0;padding-top:3px}
  .prow .v{color:var(--ink);flex:1}

  .again{text-align:center;margin-top:26px}
  .again button{background:none;border:1px solid var(--border);color:var(--ink-dim);padding:11px 26px;border-radius:8px;
    font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .15s}
  .again button:hover{border-color:var(--gold-dim);color:var(--gold-bright)}

  .spin{display:inline-block;width:18px;height:18px;border:2px solid rgba(26,18,8,.3);border-top-color:#1a1208;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .pending{text-align:center;color:var(--ink-faint);font-style:italic;padding:30px;font-size:16px}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="mark">☉</div>
    <h1>Liber Syntauri</h1>
    <div class="rule"></div>
    <p>Descubre el espíritu que te rige y cómo dialoga con la energía de hoy</p>
  </div>

  <div class="card" id="formCard">
    <div class="lead">✦ Consulta tu horóscopo ✦</div>
    <div class="fld">
      <label for="nombre">Tu nombre</label>
      <input id="nombre" type="text" placeholder="¿Cómo te llamas?" autocomplete="given-name">
    </div>
    <div class="fld">
      <label for="fnac">Tu fecha de nacimiento</label>
      <input id="fnac" type="date">
    </div>
    <button class="go" id="goBtn" onclick="consultar()">Revelar mi día</button>
    <div class="err" id="err"></div>
  </div>

  <div id="result"></div>
</div>

<script>
// ════════ CONFIG: pega tus credenciales públicas ════════
const SUPABASE_URL = 'https://mfxvfbwgcsgnubtfdcyj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1meHZmYndnY3NnbnVidGZkY3lqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNTk4ODIsImV4cCI6MjA5NTkzNTg4Mn0.IPkkOTYM1H3SzE3Az5E49FR6LwMLSQ6kMm-Ye9T_-nE'; // clave anon (pública, solo lectura)
// ═══════════════════════════════════════════════════════

const ELEM_COLOR={Fuego:'#d4622a',Agua:'#3a6f9a',Aire:'#7eb8c9',Tierra:'#8b6f3e'};
const ELEM_GLYPH={Fuego:'🜂',Agua:'🜄',Aire:'🜁',Tierra:'🜃'};
const MESES=['','enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const el=id=>document.getElementById(id);
let CUR={P:null,D:null};
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function consultar(){
  const nombre=el('nombre').value.trim();
  const fnac=el('fnac').value;
  el('err').textContent='';
  if(!nombre){el('err').textContent='Por favor escribe tu nombre.';return;}
  if(!fnac){el('err').textContent='Por favor elige tu fecha de nacimiento.';return;}

  const btn=el('goBtn'); const orig=btn.innerHTML;
  btn.disabled=true; btn.innerHTML='<span class="spin"></span>';

  try{
    if(SUPABASE_URL.includes('TU_PROJECT_ID')) throw new Error('Configura tus credenciales de Supabase en el archivo.');
    const hoy=new Date().toISOString().slice(0,10);
    const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_horoscopo`,{
      method:'POST',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json'},
      body:JSON.stringify({fecha_nacimiento:fnac, fecha_consulta:hoy})
    });
    if(!r.ok) throw new Error('No se pudo consultar ('+r.status+').');
    const data=await r.json();
    render(nombre,data);
  }catch(e){
    el('err').textContent='⚠ '+(e.message||e);
  }finally{
    btn.disabled=false; btn.innerHTML=orig;
  }
}

// ════ Full spirit description modal ════
function openSpirit(which){
  const s = CUR[which]; if(!s) return;
  const role = which==='P' ? 'Tu espíritu' : 'Hoy rige';
  el('spName').textContent = s.nombre||'';
  el('spRole').textContent = role;
  const col = ELEM_COLOR[s.elemento]||'#555';
  const orb = el('spOrb');
  orb.style.background = col;
  orb.style.boxShadow = `0 0 0 3px ${col}55, 0 0 18px ${col}55`;
  orb.textContent = ELEM_GLYPH[s.elemento]||'✦';

  // Block of prose (label + paragraph), preserving line breaks; skipped if empty.
  const blk=(label,val)=> val ? `<div style="margin-bottom:18px">
      <div style="font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-dim,#7a6330);margin-bottom:6px">${label}</div>
      <div style="color:var(--ink,#ece3cc);font-size:15.5px;line-height:1.65;white-space:pre-wrap">${esc(val)}</div>
    </div>` : '';
  // Inline short field (label: value on one row)
  const inl=(label,val)=> val ? `<div style="display:flex;gap:12px;padding:8px 0;border-bottom:1px solid rgba(52,41,27,.45)">
      <div style="font-family:'Cinzel',serif;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-faint,#73694f);width:120px;flex-shrink:0;padding-top:2px">${label}</div>
      <div style="color:var(--ink,#ece3cc);flex:1;font-size:15px;line-height:1.5">${esc(val)}</div>
    </div>` : '';
  const quote=(label,val)=> val ? `<div style="margin-bottom:18px">
      <div style="font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-dim,#7a6330);margin-bottom:6px">${label}</div>
      <div style="color:var(--gold,#cba653);font-size:16px;line-height:1.6;font-style:italic;white-space:pre-wrap">“${esc(val)}”</div>
    </div>` : '';

  el('spBody').innerHTML =
    blk('Dominio', s.dominio) +
    blk('Perfil', s.perfil) +
    blk('Fuerza de Ruptura', s.fuerza_ruptura) +
    blk('Fuerza de Restauración', s.fuerza_restauracion) +
    blk('Función', s.funcion) +
    quote('Decreto', s.decreto) +
    quote('Verso del Restaurador', s.verso_restaurador) +
    quote('Verso', s.verso) +
    (s.frase?quote('Frase', s.frase):'') +
    `<div style="margin-top:14px">` +
      inl('Elemento', s.elemento) +
      inl('Plano de acción', s.plano_accion) +
      inl('Color', s.color) +
      inl('Energía dominante', s.energia_dominante) +
      inl('Don del alma', s.don_del_alma) +
      inl('Misión', s.mision) +
      inl('Animal', s.animal) +
      inl('Árbol', s.arbol) +
      inl('Compatibilidades', s.compatibilidades) +
      inl('Frecuencias desafiantes', s.frecuencias_desafiantes) +
      inl('Sello vibracional', s.sello_vibracional) +
    `</div>`;
  el('spBody').parentElement.parentElement.scrollTop = 0;
  el('spOv').style.display='block';
  document.body.style.overflow='hidden';
}
function closeSpirit(){
  el('spOv').style.display='none';
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSpirit();});

function render(nombre,d){
  const P=d.signo_personal, D=d.signo_dia, C=d.combinacion, I=d.interaccion_elemental;
  if(!P){el('err').textContent='No encontramos un signo para esa fecha.';return;}
  CUR.P=P; CUR.D=D;

  const hoy=new Date();
  const fechaTxt=`${hoy.getDate()} de ${MESES[hoy.getMonth()+1]} de ${hoy.getFullYear()}`;
  const orb=(s,role,which)=>`<div class="sg" role="button" tabindex="0" onclick="openSpirit('${which}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openSpirit('${which}')}" style="cursor:pointer">
      <div class="orb" style="background:${ELEM_COLOR[s.elemento]||'#555'};--oc:${(ELEM_COLOR[s.elemento]||'#555')}55">${ELEM_GLYPH[s.elemento]||'✦'}</div>
      <div class="nm">${esc(s.nombre)}</div><div class="rl">${role}</div>
      <div class="tapln">ver descripción ›</div></div>`;

  // combination body — falls back gracefully if the row isn't written yet
  let comboHTML;
  if(C && C.texto){
    comboHTML=`
      ${C.titulo?`<div class="title">${esc(C.titulo)}</div>`:''}
      <div class="body"><p class="texto">${esc(C.texto)}</p></div>
      <div class="blocks">
        ${C.tension?`<div class="blk tension"><h4><span class="i">⚡</span>La tensión del encuentro</h4><p>${esc(C.tension)}</p></div>`:''}
        ${C.don_combinacion?`<div class="blk don"><h4><span class="i">✦</span>El don de hoy</h4><p>${esc(C.don_combinacion)}</p></div>`:''}
        ${C.sombra_combinacion?`<div class="blk sombra"><h4><span class="i">☾</span>La sombra a cuidar</h4><p>${esc(C.sombra_combinacion)}</p></div>`:''}
      </div>
      ${C.frase_dia?`<div class="frase"><div class="q">“</div><p>${esc(C.frase_dia)}</p></div>`:''}`;
  } else if(I && I.descripcion){
    // fallback: elemental interaction while the unique text is still being written
    comboHTML=`
      ${I.titulo?`<div class="title">${esc(I.titulo)}</div>`:''}
      <div class="body"><p class="texto">${esc(I.descripcion)}</p></div>
      <div class="blocks">
        ${I.don?`<div class="blk don"><h4><span class="i">✦</span>El don de hoy</h4><p>${esc(I.don)}</p></div>`:''}
        ${I.advertencia?`<div class="blk sombra"><h4><span class="i">☾</span>La sombra a cuidar</h4><p>${esc(I.advertencia)}</p></div>`:''}
      </div>
      ${D.frase?`<div class="frase"><div class="q">“</div><p>${esc(D.frase)}</p></div>`:''}`;
  } else {
    comboHTML=`<div class="pending">El verso de este encuentro aún se está escribiendo en el Liber. Vuelve pronto.</div>`;
  }

  const prow=(k,v)=>v?`<div class="prow"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`:'';

  el('result').innerHTML=`
    <div class="reading">
      <div class="hero">
        <div class="crest">
          ${orb(P,'Tu espíritu','P')}
          <span class="cross">✕</span>
          ${orb(D,'Hoy rige','D')}
        </div>
        <div class="greet">${esc(nombre)}, naciste bajo <b style="color:var(--gold-bright)">${esc(P.nombre)}</b> y hoy vibra <b style="color:var(--gold-bright)">${esc(D.nombre)}</b></div>
        <div class="today">${fechaTxt}</div>
      </div>

      ${comboHTML}

      ${I&&(I.titulo||I.descripcion)&&C&&C.texto?`
        <div class="elem-strip">
          <span class="tag">${esc(P.elemento)} × ${esc(D.elemento)}</span><b>${esc(I.titulo||'')}</b>
          ${I.descripcion?`<p>${esc(I.descripcion)}</p>`:''}
        </div>`:''}

      <div class="spbtns">
        <button type="button" onclick="openSpirit('P')">Descripción de ${esc(P.nombre)} ›</button>
        <button type="button" onclick="openSpirit('D')">Descripción de ${esc(D.nombre)} ›</button>
      </div>
    </div>

    <div class="again"><button onclick="reset()">Consultar otra fecha</button></div>`;

  el('formCard').style.display='none';
  el('result').classList.add('show');
  el('result').scrollIntoView({behavior:'smooth',block:'start'});
}

function reset(){
  el('result').classList.remove('show');
  el('result').innerHTML='';
  el('formCard').style.display='block';
  el('err').textContent='';
  window.scrollTo({top:0,behavior:'smooth'});
}

el('nombre').addEventListener('keydown',e=>{if(e.key==='Enter')el('fnac').focus();});
el('fnac').addEventListener('keydown',e=>{if(e.key==='Enter')consultar();});
</script>
<!-- ════ MODAL: descripción completa del espíritu ════ -->
<div id="spOv" onclick="if(event.target===this)closeSpirit()" style="display:none;position:fixed;inset:0;z-index:1000;background:rgba(6,5,4,.82);backdrop-filter:blur(3px);padding:20px;overflow-y:auto">
  <div style="max-width:620px;margin:30px auto;background:linear-gradient(168deg,#16120d 0%,#0d0a07 100%);border:1px solid var(--gold-dim,#7a6330);border-radius:14px;box-shadow:0 30px 90px rgba(0,0,0,.7);overflow:hidden">
    <div style="display:flex;align-items:center;gap:14px;padding:20px 24px;border-bottom:1px solid var(--border,#2a2219);position:sticky;top:0;background:#16120d;z-index:2">
      <div id="spOrb" style="width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0"></div>
      <div style="flex:1">
        <div id="spName" style="font-family:'Cinzel',serif;font-size:19px;color:var(--gold-bright,#e8c874);letter-spacing:1px"></div>
        <div id="spRole" style="font-size:11px;color:var(--ink-faint,#73694f);letter-spacing:1.5px;text-transform:uppercase"></div>
      </div>
      <button onclick="closeSpirit()" style="background:none;border:none;color:var(--ink-faint,#73694f);font-size:28px;cursor:pointer;line-height:1;padding:0 4px">×</button>
    </div>
    <div id="spBody" style="padding:8px 24px 26px"></div>
  </div>
</div>
</body>
</html>
